<style>
.root-tokens, :root{
  color-scheme: light;
  --paper:#FFFFFF; --surface:#FFFFFF; --wash:#F3F7FB;
  --ink:#0E3355; --ink-2:#345E84; --ink-3:#7195B1;
  --rule:#DCE7F1; --brand:#0E3355; --on-brand:#FFFFFF;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh;
  background:var(--paper); color:var(--ink);
  font-family:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  font-size:1.2rem; line-height:1.65;
  display:flex; align-items:center; justify-content:center;
  padding:2rem 1.25rem;
}
.box{width:min(100%,34rem)}
.eyebrow{
  font-family:"Montserrat",Helvetica,Arial,sans-serif;
  font-size:1.05rem; font-weight:800; letter-spacing:-.005em;
  text-transform:uppercase; color:var(--brand); margin:0 0 1rem;
}
h1{
  font-family:"Archivo",Helvetica,Arial,sans-serif;
  font-variation-settings:"wdth" 112;
  font-size:clamp(2rem,1.5rem + 2.4vw,3rem); font-weight:700;
  line-height:1.05; margin:0 0 .9rem; text-wrap:balance;
}
p{color:var(--ink-2); margin:0 0 1.6rem}
.card{
  background:var(--surface); border:1px solid var(--rule);
  border-left:6px solid var(--brand); border-radius:0 14px 14px 0; padding:1.3rem 1.4rem;
  display:flex; flex-direction:column; gap:.3rem; margin-bottom:1.6rem;
}
.card .lbl{
  font-size:.92rem; font-weight:700; letter-spacing:.13em;
  text-transform:uppercase; color:var(--ink-2);
}
.card a{
  font-family:"Archivo",Helvetica,Arial,sans-serif; font-weight:800;
  font-size:clamp(2rem,1.4rem + 2.8vw,2.9rem); font-variant-numeric:tabular-nums;
  color:var(--ink); text-decoration:none; line-height:1;
}
.card a:hover{color:var(--brand)}
.btn{
  display:inline-flex; align-items:center; min-height:3.25rem;
  padding:.75rem 1.4rem; border-radius:999px;
  background:var(--brand); color:var(--on-brand);
  font-weight:700; text-decoration:none; border:2px solid var(--brand);
}
.btn:hover{filter:brightness(1.08)}
a:focus-visible{outline:3px solid var(--brand); outline-offset:3px}
</style>
</head>
<body>
  <div class="box">
    <p class="eyebrow">Ultimate Transport</p>

    <p>The link may be old or mistyped. If you were trying to book a ride, the fastest thing to do is call us. We&rsquo;ll take it from there.</p>
    <div class="card">
      <span class="lbl">Call to schedule</span>
      <a href="tel:+16512741881">651&#8209;274&#8209;1881</a>
    </div>
    <a class="btn" href="/">Back to the main page</a>
  </div>
</body>
