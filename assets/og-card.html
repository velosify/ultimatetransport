<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family:"Montserrat"; font-weight:800; src:url("FONTDIR/montserrat-latin-800-normal.woff2") format("woff2"); }
  @font-face { font-family:"Montserrat"; font-weight:700; src:url("FONTDIR/montserrat-latin-700-normal.woff2") format("woff2"); }
  @font-face { font-family:"Archivo"; font-weight:800; src:url("FONTDIR/archivo-latin-800-normal.woff2") format("woff2"); }
  @font-face { font-family:"Source Sans 3"; font-weight:400; src:url("FONTDIR/source-sans-3-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family:"Source Sans 3"; font-weight:700; src:url("FONTDIR/source-sans-3-latin-700-normal.woff2") format("woff2"); }

  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #FFFFFF; color: #0E3355;
    font-family: "Source Sans 3", sans-serif; display: flex;
  }
  .rail { width: 16px; background: #0E3355; flex: 0 0 auto; }
  .stage { flex: 1; padding: 56px 56px 52px; display: flex; align-items: center; gap: 40px; position: relative; }
  .wash { position: absolute; right: -150px; bottom: -190px; width: 580px; height: 580px;
          border-radius: 50%; background: radial-gradient(circle, #EDF4FB 0%, rgba(237,244,251,0) 70%); }
  .copy { position: relative; flex: 1; min-width: 0; }
  .eyebrow { font-size: 19px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: #345E84; }
  .wordmark { font-family: "Montserrat", sans-serif; font-weight: 800; text-transform: uppercase;
              font-size: 74px; line-height: .96; letter-spacing: -.015em; margin-top: 14px; }
  .tagline { font-size: 27px; line-height: 1.35; color: #345E84; max-width: 22ch; margin-top: 18px; }
  .foot { margin-top: 30px; padding-top: 22px; border-top: 2px solid #DCE7F1;
          display: flex; align-items: flex-end; justify-content: space-between; gap: 32px; }
  .lbl { font-size: 16px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: #7195B1; }
  .num { font-family: "Archivo", sans-serif; font-weight: 800; font-size: 64px; line-height: 1;
         font-variant-numeric: tabular-nums; letter-spacing: -.025em; margin-top: 4px; white-space: nowrap; }
  .who { font-size: 19px; color: #345E84; text-align: right; line-height: 1.4; padding-bottom: 5px; white-space: nowrap; }
  .who strong { display: block; color: #0E3355; font-weight: 700; font-size: 23px; }
  .markwrap { position: relative; flex: none; color: #0E3355; }
  .markwrap svg { display: block; height: 272px; width: auto; }
</style>
</head>
